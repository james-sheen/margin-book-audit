[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "margin-book-audit"
dynamic = ["version"]
description = "Of the forecasts a margin book expected, which arrived, which can be scored, and which beat a random walk"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "James Sheen"}]
keywords = ["forecast", "calibration", "margin", "audit", "arbiter"]

# Stage one -- reading a register, reading a feed, and classifying the pairs
# three ways -- has no dependency on the engine. That is a claim this package
# asserts rather than describes: `tests/test_stage_one_is_dependency_free.py`
# imports every stage-one module with the engine made unimportable and runs the
# whole classification path.
dependencies = ["presence-audit>=0.1.8,<0.2"]

[project.optional-dependencies]
# THE FLOOR IS 0.1.18 AND THE REASON IS MEASURED, not a preference. One thing
# this package needs does not exist below it:
#
#   - `api.ingest_forecasts`, `api.feed_model_figures` and `api.as_of` are not
#     there. The calls themselves are older; what 0.1.18 adds is their
#     presence on `api`, which is the SUPPORTED surface -- one of the fourteen
#     names the engine's `__all__` carries. This package reached them through
#     `arbiter_engine.forecast` and `arbiter_engine.clock`, deep paths the
#     engine's README says may move without a major version. So the `<0.2`
#     ceiling asserted a promise for paths the engine had not promised, and
#     the ceiling was the only thing standing between this package and a
#     silent move. Nothing was broken; the guarantee was.
#
# MEASURED 2026-09-18: this suite against 0.1.17, the highest release below
# the floor, fails 47 tests -- every one of them because the import does not
# resolve, which is what a floor naming a surface rather than a behaviour
# looks like when it is honest.
#
# HOW, because the method is part of the claim. A clean virtualenv, engine
# 0.1.17 installed FROM THE INDEX, this package installed `--no-deps`, whole
# suite run. NOT by `battery/probe_pin.py`, which is the oracle and cannot run
# this comparison yet: the probe installs every release the range admits and
# FAILS ON A COULD-NOT-RUN, and the range's floor does not exist on the index
# until the engine ships. The previous floor's figure was recorded the same way
# and did not say so -- which left a number in this file that read as the
# probe's output and could not have been. Re-derive with the probe once 0.1.18
# is published; until then this is a hand measurement and is labelled as one.
#
# The 0.1.17 floor's reason still holds and is no longer the binding one:
#
#   - `ingest_forecasts` takes no `source=`, so this package's own reference
#     forecaster cannot be told apart from a desk's producer. The eight shadow
#     axioms then run over the reference's predictions and report against the
#     book: measured on a clean three-account book, `--self-forecast` took the
#     run from `exit 0, findings 0` to `exit 1, findings 6`, three of them
#     `forecast_below_critical_threshold` at severity CRITICAL about accounts
#     whose real balance was above the line. There is no bridge-side fix -- the
#     findings carry no model id, so nothing downstream can attribute them.
#
# Measured when it was the binding floor: this suite against 0.1.16 failed 13.
#
# The 0.1.16 floor's reasons still hold and are no longer the binding ones.
# Three things this package reads did not exist below THAT:
#
#   - `check` does not mount the `shadow` leg, so every shadow row in
#     `floors.py` is unreachable and a forecast the engine REFUSED to judge is
#     reported as a forecast with nothing wrong;
#   - `model_describe` does not carry `dropped_declarations`, so the generated
#     model's read-back finds nothing and passes for a model whose declarations
#     the loader rejected -- the gate cannot fire at all;
#   - `project` reads a `{from_property:}` bound as no bound, so the floor each
#     account is actually held to cannot be projected against.
#
# MEASURED 2026-09-17: this suite against 0.1.16 passes; against 0.1.15, the
# highest release below the floor, 43 tests fail. The control is what makes the
# claim worth anything -- a floor whose predecessor also passes is a floor
# somebody guessed.
#
# The previous floor was 0.1.15 and its reason was a crash: `loss_margin: 0` on
# the forecaster's expected-against-issued balance divided a deficit ratio by
# zero on every earlier release, so a model skipping two thirds of its subjects
# surfaced as a broken run. That reason still holds; it is no longer the
# binding one.
#
# `battery/probe_pin.py --sweep` is the oracle and re-derives this on a pin
# change; it is not re-read from here.
# The paragraph that used to sit here said this floor NAMED AN UNPUBLISHED
# VERSION and that CI would stay red until the engine shipped 0.1.18. It did
# ship; the sentence outlived its condition and is gone rather than left to
# read as current.
#
# THE CEILING MOVED TO 0.2 ON A MEASUREMENT, 2026-09-24, AND IT COULD NOT MOVE
# ALONE. On 0.2.4 the shadow leg gained `not_a_producers_submission`, which
# fires on this package's own doing: `--self-forecast` files the reference
# forecaster's rows with a `source=` precisely so the eight axioms stay off
# them. `floors.py` had no rule for a reason that did not exist when it was
# written, and this package fails CLOSED on an unruled decline -- so seven
# tests reported a broken audit for a book that was merely being controlled.
#
# The floor for it is CLEAN and it is version-coupled in BOTH directions:
# `test_no_floor_rules_on_a_reason_that_cannot_happen` fails on 0.1.18 with the
# row present, measured. The pin and the floor are therefore one change, and
# splitting them reddens whichever half lands first.
#
# Measured on 0.2.4 with the row: 168 passed, the same figure 0.1.18 reported
# without it.
engine = ["arbiter-engine>=0.2.4,<0.3"]

[project.scripts]
margin-book-audit = "margin_book_audit.cli:main"

[project.urls]
Homepage = "https://github.com/james-sheen/margin-book-audit"
Issues = "https://github.com/james-sheen/margin-book-audit/issues"
Source = "https://github.com/james-sheen/margin-book-audit"

[tool.hatch.version]
path = "src/margin_book_audit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/margin_book_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
